name: Feature request
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 问题
      description: 这个需求解决了什么问题？谁会遇到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 描述你希望的行为、页面或接口。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - VS Code 安装包缓存
        - 插件上传/市场缓存
        - Remote-SSH Server
        - 任务与存储
        - 访问统计与日志
        - 公告
        - VS Code gallery 接入
        - 安全与鉴权
        - 部署与运维
        - 文档
        - 其他

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue，未找到重复
          required: true
