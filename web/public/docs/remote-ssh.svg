<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Remote-SSH 离线配置">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fa6c9"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="18" fill="#f8fbff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#10233a">Remote-SSH 离线工作方式</text>
  <text x="40" y="69" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7f94">客户端与服务端的 VS Code commit 必须完全一致，server 需提前放到远端目录。</text>

  <rect x="40" y="98" width="300" height="236" rx="14" fill="#fff" stroke="#e2eaf4"/>
  <rect x="40" y="98" width="300" height="40" rx="14" fill="#0d2c49"/>
  <rect x="40" y="124" width="300" height="14" fill="#0d2c49"/>
  <text x="60" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#fff">本地客户端（Windows / macOS）</text>
  <text x="60" y="166" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#425466">VS Code 版本：1.95.0</text>
  <text x="60" y="190" font-family="Consolas, monospace" font-size="12" fill="#005a9e">commit: 912bb683…5b95</text>
  <text x="60" y="218" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#425466">已安装 Remote-SSH 扩展</text>
  <rect x="60" y="238" width="260" height="80" rx="8" fill="#f3f8fe" stroke="#dbeafb"/>
  <text x="72" y="258" font-family="Consolas, monospace" font-size="10" fill="#005a9e">"remote.SSH.localServerDownload"</text>
  <text x="72" y="274" font-family="Consolas, monospace" font-size="10" fill="#005a9e">  : "off"</text>
  <text x="72" y="296" font-family="Consolas, monospace" font-size="10" fill="#005a9e">"remote.SSH.serverInstallPath"</text>
  <text x="72" y="311" font-family="Consolas, monospace" font-size="10" fill="#005a9e">  : { "10.0.0.12": "/opt/vscode-server" }</text>

  <line x1="344" y1="216" x2="408" y2="216" stroke="#7fa6c9" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="348" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7f94">SSH</text>

  <rect x="416" y="98" width="504" height="236" rx="14" fill="#fff" stroke="#e2eaf4"/>
  <rect x="416" y="98" width="504" height="40" rx="14" fill="#0078d4"/>
  <rect x="416" y="124" width="504" height="14" fill="#0078d4"/>
  <text x="436" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#fff">远端主机（Linux / Windows / macOS ARM）</text>
  <text x="436" y="166" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#425466">预置 server 目录（commit 必须一致）：</text>
  <rect x="436" y="178" width="464" height="34" rx="7" fill="#0c1b2a"/>
  <text x="448" y="200" font-family="Consolas, monospace" font-size="11" fill="#d7e7f7">~/.vscode-server/bin/912bb683…5b95/bin/code-server</text>
  <text x="436" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#425466">解压 server 包到该目录，并确保 node 可执行：</text>
  <rect x="436" y="252" width="464" height="62" rx="7" fill="#0c1b2a"/>
  <text x="448" y="272" font-family="Consolas, monospace" font-size="10.5" fill="#d7e7f7">mkdir -p ~/.vscode-server/bin/&lt;commit&gt;</text>
  <text x="448" y="290" font-family="Consolas, monospace" font-size="10.5" fill="#d7e7f7">tar -xzf vscode-server-linux-x64.tar.gz -C ~/.vscode-server/bin/&lt;commit&gt; \</text>
  <text x="448" y="306" font-family="Consolas, monospace" font-size="10.5" fill="#d7e7f7">  --strip-components=1</text>

  <rect x="40" y="354" width="880" height="42" rx="9" fill="#fff6e8" stroke="#f5dfba"/>
  <text x="58" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.8" fill="#8a5a00">常见根因：commit 不一致 / 目录权限不足 / 没装 Remote-SSH 扩展 / server 包与远端架构不匹配。升级 VS Code 后必须同步更新 server。</text>
</svg>
